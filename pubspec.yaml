name: dairy_farm
description: "Krishna Dairy Farm - Smart Farm Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/dairy_logo.png"
  adaptive_icon_background: "#0C3823"
  adaptive_icon_foreground: "assets/images/dairy_logo.png"
  web:
    generate: true
    image_path: "assets/images/dairy_logo.png"
  windows:
    generate: true
    image_path: "assets/images/dairy_logo.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/images/
